dol1 = new Date()

async function loadStats(playerTag) {
    try {
        const response = await fetch(`http://127.0.0.1:5000/api/player/${playerTag}`);
        
        // 1. Если Flask вообще выключен (Ошибка 404 или нет связи)
        if (!response.ok) {
            console.error(`Сервер недоступен: ${response.status}`);
            return { error: "Flask отключен" }; 
        }
        
        const homs = await response.json();

        // 2. Если Flask работает, но API Brawl Stars выдало ошибку (Техперерыв)
        if (homs.error) {
            console.warn(`Проблема с API для ${playerTag}:`, homs.error);
            // Возвращаем объект с ошибкой, чтобы основной код знал, что рисовать красный блок
            return homs; 
        }
        
        // 3. Если всё отлично — сохраняем в homer
        console.log('Данные получены:', homs);
        homer = homs;
        return homs;
        
    } catch (error) {
        // Если вообще нет интернета или Flask «упал»
        console.error(`Критическая ошибка для тега ${playerTag}:`, error);
        return { error: "Ошибка сети или Flask" };
    }
}

    else if (diffSeason >= 1000) { colorSeason = "#00ff00"; }
    else if (diffSeason > 0) { colorSeason = "#ffff00"; }

    let timePart = homer.updated ? homer.updated.split('T')[1].slice(0, 8) : '--:--:--';

    // ВЫВОД: Добавляем новые строки в контейнер
    document.getElementById('competitionContainer1').innerHTML = `
        <div style="font-size: 18px; font-family: '2';">
            <div style="color: ${color};">${homer.name}: ${current} кубков<br>[${diff > 0 ? '+' : ''}${diff}] за сегодня</div>

function lesa3() {
    // Точки отсчета
    let startToday1 = 199000;
    let startWeek1 = 195000;
    let startSeason1 = 180000;

    // Маленькая функция для знака + внутри основной
    const fmt = (val) => (val >= 0 ? `+${val}` : val);

    // Расчеты
    let diffDay = fmt(homer.trophies - startToday1);
    let diffWeek = fmt(homer.trophies - startWeek1);
    let diffSeason = fmt(homer.trophies - startSeason1);

    document.getElementById('competitionContainer1').innerHTML = `
        <div style="color: #ffffff; font-size: 18px; font-family: '2';">
            [${homer.name}]<br>
            [${diffDay}] за сегодня<br>
            [${diffWeek}] за неделю<br>
            [${diffSeason}] за сезон
        </div>`;
}

// Укажи точную дату окончания сезона
const seasonEndDate = new Date("5 7, 2026 15:00:00").getTime();

function updateSeasonTimer() {
    const now = new Date().getTime();
    const distance = seasonEndDate - now;

    if (distance < 0) {
        document.getElementById("seasonTimer").innerHTML = "СЕЗОН ЗАВЕРШЕН!";
        return;
    }

    // Расчет времени
    const days = Math.floor(distance / (1000 * 60 * 60 * 24));
    const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
    const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
    const seconds = Math.floor((distance % (1000 * 60)) / 1000);

    // Вывод в формате Д:Ч:М:С
    document.getElementById("seasonTimer").innerHTML = 
        `${days}д ${hours}ч ${minutes}м ${seconds}с`;
}

// Запуск каждую секунду
setInterval(updateSeasonTimer, 1000);
