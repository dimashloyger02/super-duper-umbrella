<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <title>Ultimate Level Tracker v4.0</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
        @font-face {
    font-family: '1';
    src: url('https://brawltytlol.vercel.app/css/progresspixel8bit.ttf');
}
@font-face {
    font-family: '2';
    src: url('https://brawltytlol.vercel.app/css/progresspixel8bitpab.ttf');
}
@font-face {
    font-family: '3';
    src: url('https://brawltytlol.vercel.app/css/DOSFont.ttf');
}
@font-face {
    font-family: '4';
    src: url('https://brawltytlol.vercel.app/css/ABFlockHeadline-Regular.ttf');
}
@font-face {
    font-family: '5';
    src: url('https://brawltytlol.vercel.app/css/Rubik-Regular.ttf');
}
        @font-face {
            font-family: '6';
            src: url('https://forumstatic.ru/files/001a/a3/94/73088.ttf?v=1');
        }

    body { 
        background: #000; 
        color: #fff; 
        font-family: '2', sans-serif; 
        display: flex; 
        flex-direction: column; 
        align-items: center; /* Центрируем по горизонтали */
        justify-content: flex-start; /* Прижимаем к верху */
        padding: 15px; 
        margin: 0; 
        min-height: 100vh;
    }
    
    #main-container { 
        border: 4px solid #ffff00; 
        width: 400px; 
        background: #000; 
        color: #ffff00; 
        padding: 15px; 
        box-sizing: border-box; 
        /* Блок теперь будет сверху с небольшим отступом */
        margin-top: 10px; 
    }

    /* Новый блок для топа под основным контейнером */
    #topers-container {
        width: 400px;
        margin-top: 20px;
        border: 2px dashed #555;
        padding: 10px;
        box-sizing: border-box;
    }
    
    .toper-item {
        font-family: '1';
        font-size: 13px;
        margin-bottom: 5px;
        display: flex;
        justify-content: space-between;
    }

            .stat-row { margin-bottom: 8px; font-family: '1'; font-size: 14px; }
        .stat-val { color: #fff; float: right; font-family: '2'; }

        /* Стили целей */
        .task-box { position: relative; margin-top: 18px; }
        .task-status { display: flex; justify-content: space-between; font-size: 11px; color: #ffff00; margin-bottom: 4px; font-family: '1'; }
        
        .progress-bg { position: relative; height: 16px; border: 1px solid #555; background: #111; overflow: hidden; }
        .task-counter { position: absolute; width: 100%; top: 0; left: 0; z-index: 10; text-align: center; font-size: 10px; color: #ffffff; line-height: 16px; pointer-events: none; text-shadow: 1px 1px 2px #000; font-family: '2'; }
        .progress-bar { height: 100%; background: #007bff; width: 0%; transition: width 0.4s ease-out; }

        /* Таймер под полоской */
        .task-footer { font-size: 9px; color: #ff3333; text-align: right; margin-top: 4px; font-family: '1'; }

        button { width: 100%; padding: 12px; background: #222; color: #00ff00; border: 2px solid #00ff00; font-family: '2'; text-transform: uppercase; cursor: pointer; margin-top: 15px; }
        .service-btns { display: flex; gap: 5px; margin-top: 10px; }
        .btn-small { padding: 5px; font-size: 10px; border-color: #555; color: #aaa; width: 33%; }
</style>

</head>
<body onload="">

    <div id="main-container">
        <div class="header">TRACKER v4.0</div>
        
        <div class="stat-row">ШАГИ: <span class="stat-val" id="step-display">0</span></div>
        <div class="stat-row">СКОРОСТЬ: <span class="stat-val"><span id="speed-display">0.0</span> КМ/Ч</span></div>
        <div class="stat-row">БОНУС: <span class="stat-val" id="walk-bonus">0.00</span></div>
        
        <div id="goals-list"></div>

        <button id="access-btn" onclick="requestAccess()">ЗАПУСТИТЬ</button>

        <div class="service-btns">
            <button class="btn-small" onclick="exportData()">БЭКАП</button>
            <button class="btn-small" onclick="importData()">ВСТАВИТЬ</button>
            <button class="btn-small" style="color:#ff3333" onclick="resetAll()">СБРОС</button>
        </div>
    </div>

<!-- В HTML после закрытия </div> от #main-container добавь это: -->
<div id="topers-container">
    <div style="text-align: center; font-size: 10px; color: #aaa; margin-bottom: 10px;">ГЛОБАЛЬНЫЙ ТОП ПУША</div>
    <div id="topers">
        <div class="toper-item">Загрузка списка лидеров...</div>
    </div>
                <button class="btn-small" onclick="updateTop()">ОБНОВИТЬ</button>
</div>

<script>
function updateTop() {
    const topersDiv = document.getElementById('topers');

    fetch('https://brawltytlol.vercel.app/projects/top.js')
        .then(response => response.json())
        .then(data => {
            // 1. Сортируем массив: (b - a) ставит большие числа наверх
            const sortedPlayers = data.players.sort((a, b) => b.steps - a.steps);

            // 2. Формируем HTML
            topersDiv.innerHTML = sortedPlayers.map((player, index) => {
                // Выделяем тебя в списке, чтобы было нагляднее
                const isMe = player.name === "Ты" ? 'style="color: #ffcc00; font-weight: bold;"' : '';
                
                return `<div ${isMe}>${index + 1}. ${player.name} — ${player.steps.toLocaleString()} шагов</div>`;
            }).join('');
        })
        .catch(err => {
            console.error('Ошибка загрузки топа:', err);
            topersDiv.innerHTML = "Ошибка загрузки данных...";
        });
}

// Запускаем функцию
updateTop();

</script>

<script>
        const goals = [
        { id: "g0", title: "Цель дня", target: 1000, expired: "2026-05-02T00:00"}, // Изменил время
        { id: "g1", title: "Приятные мелочи", target: 1, expired: "2026-06-21T00:00" },
        { id: "g2", title: "Апрель '26", target: 200000, expired: "2026-05-01T00:00"},
        { id: "g3", title: "Самый нежный вызов", target: 80000, expired: "2026-05-28T00:00" },
        { id: "g4", title: "По-пингвиньи", target: 90000, expired: "2026-05-08T00:00"}
    ];

    let savedData = JSON.parse(localStorage.getItem('tracker_data')) || { steps: 0, money: 0 };
    let steps = savedData.steps;
    let walkMoney = savedData.money;
    let threshold = 9.5;
    let isWaiting = false;
    let lastSpeed = 0;

    function renderUI() {
        const list = document.getElementById('goals-list');
        const now = new Date();
        let html = '';
        
        goals.forEach(g => {
            if (g.expired && new Date(g.expired) < now) return;

            html += `
                <div class="task-box">
                    <div class="task-status">
                        <span style="font-size: 13px">${g.title}</span>
                        <span id="perc-${g.id}" style="font-size: 13px">0%</span>
                    </div>
                    <div class="progress-bg">
                        <div id="txt-${g.id}" style="font-size: 13px" class="task-counter">[ 0 / ${g.target} ]</div>
                        <div id="bar-${g.id}" style="font-size: 13px" class="progress-bar"></div>
                    </div>
                    <div id="timer-${g.id}" style="font-size: 13px" class="task-footer">0д 00ч 00м 00сек</div>
                </div>`;
        });
        list.innerHTML = html;
        saveAndRefresh();
        setInterval(updateAllTimers, 1000);
        updateAllTimers();
    }

    function updateAllTimers() {
        const now = new Date().getTime();
        goals.forEach(g => {
            const timerEl = document.getElementById(`timer-${g.id}`);
            if (!timerEl) return;
            const dist = new Date(g.expired).getTime() - now;
            if (dist < 0) { timerEl.innerHTML = "ЗАВЕРШЕНО"; return; }
            const d = Math.floor(dist / (1000*60*60*24));
            const h = Math.floor((dist % (1000*60*60*24)) / (1000*60*60));
            const m = Math.floor((dist % (1000*60*60)) / (1000*60));
            const s = Math.floor((dist % (1000*60)) / 1000);
            timerEl.innerHTML = `${d}д ${h}ч ${m}м ${s}сек`;
        });
    }

    function saveAndRefresh() {
        localStorage.setItem('tracker_data', JSON.stringify({steps, money: walkMoney}));
        document.getElementById('step-display').innerText = steps;
        document.getElementById('walk-bonus').innerText = walkMoney.toFixed(2);
        
        goals.forEach(g => {
            const bar = document.getElementById(`bar-${g.id}`);
            const txt = document.getElementById(`txt-${g.id}`);
            const perc = document.getElementById(`perc-${g.id}`);
            if (!bar || !txt || !perc) return;

            const level = Math.floor(steps / g.target);
            const currentLevelSteps = steps % g.target;
            const levelPercent = (currentLevelSteps / g.target * 100).toFixed(2);

            bar.style.width = levelPercent + "%";
            perc.innerText = level > 0 ? `УР. ${level} (${levelPercent}%)` : `${levelPercent} %`;
            txt.innerText = `[ ${Math.floor(currentLevelSteps)} / ${g.target} ]`;
            bar.style.background = level >= 1 ? "#999900" : "#007bff";
            if(level >= 1) perc.style.color = "#00ff00";
        });
    }

    function requestAccess() {
        if (typeof DeviceMotionEvent !== "undefined" && typeof DeviceMotionEvent.requestPermission === 'function') {
            DeviceMotionEvent.requestPermission().then(res => { if(res == 'granted') startAll(); });
        } else { startAll(); }
        document.getElementById('access-btn').innerText = "ONLINE";
        document.getElementById('access-btn').disabled = true;
    }

    function startAll() {
        window.addEventListener('devicemotion', (e) => {
            let acc = e.accelerationIncludingGravity;
            if(!acc || !acc.y) return;
            if (Math.abs(acc.y) > threshold && !isWaiting) {
                steps++; walkMoney += 0.01;
                saveAndRefresh();
                if (navigator.vibrate) navigator.vibrate(30);
                isWaiting = true; setTimeout(() => { isWaiting = false; }, 350); 
            }
        });
        navigator.geolocation.watchPosition((pos) => {
            let kmh = (pos.coords.speed || 0) * 3.6;
            let smooth = (kmh + lastSpeed) / 2;
            lastSpeed = (kmh < 0.8) ? 0 : smooth;
            document.getElementById('speed-display').innerText = lastSpeed.toFixed(1);
        }, null, { enableHighAccuracy: true });
    }

    function exportData() { prompt("КОД:", btoa(JSON.stringify({steps, money: walkMoney}))); }
    function importData() { 
        let code = prompt("КОД:"); 
        if(code) { try { let d = JSON.parse(atob(code)); steps = d.steps; walkMoney = d.money; saveAndRefresh(); } catch(e){}} 
    }
    function resetAll() { if(confirm("Сброс?")) { localStorage.clear(); location.reload(); } }
    
renderUI()
</script>
</body>
</html>
