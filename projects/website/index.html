<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brawl Stars Neon Stats</title>
            <style>
        @font-face {
    font-family: '1';
    src: url('https://brawltytlol.vercel.app/css/progresspixel8bit.ttf');
}
@font-face {
    font-family: '2';
    src: url('https://brawltytlol.vercel.app/css/progresspixel8bitpab.ttf');
}
@font-face {
    font-family: '3';
    src: url('https://brawltytlol.vercel.app/css/DOSFont.ttf');
}
@font-face {
    font-family: '4';
    src: url('https://brawltytlol.vercel.app/css/chispix-bold.ttf');
}
@font-face {
    font-family: '5';
    src: url('https://brawltytlol.vercel.app/css/chis-pix.ttf');
}
        </style>
    <style>
            /* Общие настройки экрана в стиле неоновой матрицы */
        body {
            background: #000000;
            font-size: 18px;
            color: #0099ff;
            font-family: '3', monospace;
            padding: 3px;
            margin: 0;
        }
    
        /* Твои фирменные неоновые кнопки */
        button {
            width: 165px;
            height: 45px;
            background: #000000;
            color: #00FF00;
            border: 1px solid #00FF00;
            font-family: '3', monospace;
            font-size: 18px;
            cursor: pointer;
            outline: none;
            box-shadow: 0 0 5px #00FF00;
            transition: all 60s;
        }

        button:active {
            background: #ffffff;
            color: #000;
            box-shadow: 0 0 15px #00FF00;
            transition: all 0.5s;
        }
        pre{
        font-family: '3', monospace;
        }
</style>
<div>Проверка Termux уведомления</div><br>
<!-- Кнопки без лишнего JS-кода внутри -->
<button onclick="changeAndReset(this, 'Лол'), toast1()">toast</button><button onclick="changeAndReset(this, 'Булл топ'), notify1()">notify</button><br><br>
<div id="server-response"></div>
<hr>
<div>Управление данными через Flask:</div><br>
<div id="washing-clicker">Пусто...</div><br>
<button onclick="sendProgressText(), lol1()">Сохранить</button><button onclick="deleteProgressText(), lol1()">Удалить</button><br>
<button style="width: 330px; height: 45px;" onclick="datasto1(), lol1()">Данные</button><br>
<button style="width: 330px; height: 45px;" onclick="setuuid(), lol1()">Установить UUID</button><br>
<button style="width: 330px; height: 45px;" onclick="setnick(), lol1()">Установить ник</button><br>
<button style="width: 330px; height: 45px;" onclick="setgems(), lol1()">Установить гемы</button><br>
<button style="width: 330px; height: 45px;" onclick="settgstars(), lol1()">Установить TG звезды</button><br>
<button style="width: 330px; height: 45px;" onclick="settgusername(), lol1()">Установить TG Username</button><br>
<button style="width: 330px; height: 45px;" onclick="setposition(), lol1()">Установить позицию</button><br>
<button style="width: 330px; height: 45px;" onclick="setcolor(), lol1()">Установить цвет</button><br>
<button style="width: 330px; height: 45px;" onclick="setdomain(), lol1()">Установить домен</button><br>
<button style="width: 330px; height: 45px;" onclick="settime(), lol1()">Установить время</button><br>

<script>
let tom = "";
let fusk = {};
let playerUuid = 1;
let position = 1;
let nick = "";
let gems = 0;
let tg_stars = 0;
let color = "#000000";
let tg_id = "";
let domain = "";
let uptime = "";

async function toast1(){
const text1 = tom
const proxyUrl = `http://127.0.0.1:5000/action/toast/Набрано ${text1} кликов`
const response = await fetch(proxyUrl, {
  method: 'GET'
});
const text = await response.text();
window['server-response'].innerHTML = text
}

async function notify1(){
const text0 = `Кликер`
const text1 = tom
const proxyUrl = `http://127.0.0.1:5000/action/notify/${text0}/Набрано ${text1} кликов`
const response = await fetch(proxyUrl, {
  method: 'GET'
});
const text = await response.text();
window['server-response'].innerHTML = text
}

function changeAndReset(button, newText) {
    // 1. Запоминаем исходный текст (например, "Активировать")
    const originalText = button.innerText;

    
    // 2. Меняем текст на новый ("Лол" или "Булл")
    button.innerText = newText;
    tom = newText
    
    // 3. Через 3000 мс (3 секунды) возвращаем старый текст обратно
    setTimeout(() => {
        button.innerText = originalText;
        lol1()
    }, 3000);
}

function lol1() {
    fusk = {"uuid":playerUuid,"position":position,"nick":nick,"gems":gems,"tg_stars":tg_stars,"color":color,"tg_id":tg_id,"domain":domain,"uptime":uptime};

    window['washing-clicker'].innerHTML = `Ожидание команды...`;
}

async function sendProgressText() {
    const proxyUrl = 'http://127.0.0.1:5000/api/save/member/'+playerUuid;
    
    const response = await fetch(proxyUrl, {
        method: 'POST',
        // Передаем как обычный текст, чтобы Flask не ругался на отсутствие json-заголовков
        headers: { 'Content-Type': 'text/plain' }, 
        body: JSON.stringify(fusk) 
    });
    
    const text = await response.text();
    window['server-response'].innerHTML = text; // Выведет "Прогресс успешно сохранен на сервере!"
}

async function deleteProgressText() {
    const proxyUrl = 'http://127.0.0.1:5000/api/save/member/'+playerUuid;
    
    const response = await fetch(proxyUrl, {
        method: 'DELETE',
        // Передаем как обычный текст, чтобы Flask не ругался на отсутствие json-заголовков
        headers: { 'Content-Type': 'text/plain' }, 
        body: JSON.stringify(fusk) 
    });
    
    const text = await response.text();
    window['server-response'].innerHTML = text; // Выведет "Прогресс успешно сохранен на сервере!"
}

async function datasto1(){
const proxyUrl = `http://127.0.0.1:5000/action/get_text`
const response = await fetch(proxyUrl, {
  method: 'GET'
});
const text = await response.json();
window['server-response'].innerHTML = `Данные:<pre>${JSON.stringify(text, null, 2)}</pre>`
}

function setuuid() {
let ptoso = prompt(`Установить UUID:`, playerUuid);
if (ptoso !== null && ptoso.trim() !== "") {
playerUuid = parseInt(ptoso);
}
}

function setgems() {
let ptoso = prompt(`Установить гемы:`, gems);
if (ptoso !== null && ptoso.trim() !== "") {
gems = parseInt(ptoso);
}
}

function settgstars() {
let ptoso = prompt(`Установить TG звезды:`, tg_stars);
if (ptoso !== null && ptoso.trim() !== "") {
tg_stars = parseInt(ptoso);
}
}

function setposition() {
let ptoso = prompt(`Установить позицию:`, position);
if (ptoso !== null && ptoso.trim() !== "") {
position = parseInt(ptoso);
}
}

function setnick() {
let ptoso = prompt(`Установить Никнейм:`, nick);
if (ptoso !== null && ptoso.trim() !== "") {
nick = ptoso;
}
}

function settgusername() {
let ptoso = prompt(`Установить TG Username:`, tg_id);
if (ptoso !== null && ptoso.trim() !== "") {
tg_id = ptoso;
}
}

function setcolor() {
let ptoso = prompt(`Установить цвет:`, color);
if (ptoso !== null && ptoso.trim() !== "") {
color = ptoso;
}
}

function setdomain() {
let ptoso = prompt(`Установить домен:`, domain);
if (ptoso !== null && ptoso.trim() !== "") {
domain = ptoso;
}
}

function settime() {
    // Получаем текущую дату и время смартфона
    let now = new Date();
    
    // Сдвигаем время на смещение вашего часового пояса (в минутах)
    let tzOffset = now.getTimezoneOffset() * 60000;
    let localISOTime = (new Date(now.getTime() - tzOffset)).toISOString().substring(0, 19);
    
    // Теперь в prompt будет ваше точное местное время (например, 10:54, а не 03:54)
    let ptoso = prompt(`Установить время (ISO формат):`, uptime || localISOTime);
    if (ptoso !== null && ptoso.trim() !== "") {
        uptime = ptoso;
    }
}

// Сразу загрузка скрипта
lol1()
</script>
