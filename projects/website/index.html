<button onclick="datasto1()">Загрузить данные</button><button onclick="datasto2()">Загрузить топ</button><br>

<button style="width: 330px; height: 45px;" onclick="setposition()">Установить позицию</button><br>
<button style="width: 330px; height: 45px;" onclick="setcolor()">Установить цвет</button><br>
<button style="width: 330px; height: 45px;" onclick="setdomain()">Установить домен</button><br>
<button style="width: 330px; height: 45px;" onclick="settime()">Установить время</button><br><hr>

<script>
let tom = "";
let fusk = {};
let globalplayersjson = {};
let playerUuid = null;
let gems = null;
let tg_stars = null;
let position = null;
let nick = null
let tg_id = null
let color = null
let domain = null
let uptime = null

function changeAndReset(button, newText) {
    // 1. Запоминаем исходный текст (например, "Активировать")
    const originalText = button.innerText;

    
    // 2. Меняем текст на новый ("Лол" или "Булл")
    button.innerText = newText;
    tom = newText
    
    // 3. Через 3000 мс (3 секунды) возвращаем старый текст обратно
    setTimeout(() => {
        button.innerText = originalText;
    }, 3000);
}

async function toast1(){
const text1 = tom
const proxyUrl = `http://127.0.0.1:5000/action/toast/${text1}`
const response = await fetch(proxyUrl, {
  method: 'GET'
});
const text = await response.text();
window['server-response'].innerHTML = text
}

async function notify1(){
const text0 = `Кликер`
const text1 = tom
const proxyUrl = `http://127.0.0.1:5000/action/notify/${text1}`
const response = await fetch(proxyUrl, {
  method: 'GET'
});
const text = await response.text();
window['server-response'].innerHTML = text
}

function lol1(){
fusk = {"uuid":playerUuid,"gems":gems,"tg_stars":tg_stars,"position":position,"nick":nick,"tg_id":tg_id,"color":color,"domain":domain,"uptime":uptime}

console.log(fusk)
}

async function datasto1(){
lol1()
const proxyUrl = `http://127.0.0.1:5000/action/get_text`
const response = await fetch(proxyUrl, {
  method: 'GET'
});
const text = await response.json();
globalplayersjson = text
window['server-response'].innerHTML = `Данные:<pre style="width: 330px; height: 201px; background: #000000; color: #00FF00; border: 1px solid #00FF00; font-size: 12.96px; cursor: pointer; outline: none; box-shadow: 0 0 5px #00FF00; overflow-y: auto; font-family: '4', monospace; padding: 3px;">${JSON.stringify(text, null, 2)}</pre>`
}

async function datasto2(){
lol1()
    console.log(globalplayersjson);

    let htmlTop = "";
    Object.values(globalplayersjson).forEach(user => {
        htmlTop += `<div style="color: ${user.color}; border-bottom: 1px dashed #333; padding-bottom: 5px; margin-bottom: 5px;">
#${user.position}. ${user.nick} [UUID: ${user.uuid}]<br>
Гемы: ${user.gems} 💎<br>
TG Stars: ${user.tg_stars} ⭐<br>
Время: ${user.uptime} ⏰ <br>
        </div>`;
    });

    window['toptyt-clicker'].innerHTML = htmlTop;
}

async function sendProgressText() {
lol1()
    const proxyUrl = 'http://127.0.0.1:5000/api/save/member/'+playerUuid;
    
    const response = await fetch(proxyUrl, {
        method: 'POST',
        // Передаем как обычный текст, чтобы Flask не ругался на отсутствие json-заголовков
        headers: { 'Content-Type': 'text/plain' }, 
        body: JSON.stringify(fusk) 
    });
    
    const text = await response.text();
    window['server-response'].innerHTML = text; // Выведет "Прогресс успешно сохранен на сервере!"
}

async function deleteProgressText() {
lol1()
    const proxyUrl = 'http://127.0.0.1:5000/api/save/member/'+playerUuid;
    
    const response = await fetch(proxyUrl, {
        method: 'DELETE',
        // Передаем как обычный текст, чтобы Flask не ругался на отсутствие json-заголовков
        headers: { 'Content-Type': 'text/plain' }, 
        body: JSON.stringify(fusk) 
    });
    
    const text = await response.text();
    window['server-response'].innerHTML = text; // Выведет "Прогресс успешно сохранен на сервере!"
}

function setuuid() {
let ptoso = prompt(`Установить UUID:`, `${playerUuid}`);
if (ptoso !== null && ptoso.trim() !== "") {
playerUuid = parseInt(ptoso);
}
}

function setgems() {
let ptoso = prompt(`Установить гемы:`, `${gems}`);
if (ptoso !== null && ptoso.trim() !== "") {
gems = parseInt(ptoso);
}
}

function settgstars() {
let ptoso = prompt(`Установить TG звезды:`, `${tg_stars}`);
if (ptoso !== null && ptoso.trim() !== "") {
tg_stars = parseInt(ptoso);
}
}

function setposition() {
let ptoso = prompt(`Установить позицию:`, `${position}`);
if (ptoso !== null && ptoso.trim() !== "") {
position = parseInt(ptoso);
}
}

function setnick() {
let ptoso = prompt(`Установить Никнейм:`, `${nick}`);
if (ptoso !== null && ptoso.trim() !== "") {
nick = ptoso;
}
}

function settgusername() {
let ptoso = prompt(`Установить TG Username:`, `${tg_id}`);
if (ptoso !== null && ptoso.trim() !== "") {
tg_id = ptoso;
}
}

function setcolor() {
let ptoso = prompt(`Установить цвет:`, `${color}`);
if (ptoso !== null && ptoso.trim() !== "") {
color = ptoso;
}
}

function setdomain() {
let ptoso = prompt(`Установить домен:`, `${domain}`);
if (ptoso !== null && ptoso.trim() !== "") {
domain = ptoso;
}
}

function settime() {
    // Получаем текущую дату и время смартфона
    let now = new Date();
    
    // Сдвигаем время на смещение вашего часового пояса (в минутах)
    let tzOffset = now.getTimezoneOffset() * 60000;
    let localISOTime = (new Date(now.getTime() - tzOffset)).toISOString().substring(0, 19);
    
    // Теперь в prompt будет ваше точное местное время (например, 10:54, а не 03:54)
    let ptoso = prompt(`Установить время (ISO формат):`, `${localISOTime}` || localISOTime);
    if (ptoso !== null && ptoso.trim() !== "") {
        uptime = ptoso;
    }
}


// Сразу загрузка скрипта
</script>
